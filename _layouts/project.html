---
layout: default
---
<article class="project-detail">
  <div class="container">
    <h1>{{ page.title }}</h1>
    {% if page.tags %}
    <div class="project-tags">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
    {{ content }}
    {% if page.github %}
    <a href="{{ page.github }}" class="btn" target="_blank" rel="noopener">View on GitHub</a>
    {% endif %}
    <a href="{{ '/projects/' | relative_url }}" class="btn btn-outline">← All Projects</a>
  </div>
</article>
